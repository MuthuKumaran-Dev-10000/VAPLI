
workflows:
  ios-release:
    name: iOS Release

    environment:
      flutter: stable
      xcode: latest

    scripts:

      - name: Flutter packages
        script: |
          flutter pub get

      - name: Build iOS dependencies only
        script: |
          cd ios
          flutter build ios --config-only --no-codesign

      - name: Patch Pods project
        script: |
          cd ios

          sed -i '' \
          's/CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER = YES;/CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER = NO;/g' \
          Pods/Pods.xcodeproj/project.pbxproj

          sed -i '' \ "s/DEFINES_MODULE = YES;/DEFINES_MODULE = NO;/g" \ Pods/Pods.xcodeproj/project.pbxproj

          echo "Pods patched."

      - name: Final iOS build
        script: |
          flutter build ios --release --no-codesign
