<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VAPLI audit and inspection workspace.">
  <meta name="theme-color" content="#0C0D0F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VAPLI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VAPLI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0c0d0f;
      color: #f0eee9;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .boot-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(26,188,189,0.12), transparent 32%), #0c0d0f;
    }
    .boot-card {
      padding: 22px 26px;
      border-radius: 18px;
      border: 1px solid #252830;
      background: rgba(20, 22, 24, 0.92);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
      min-width: 240px;
    }
    .boot-ring {
      width: 42px;
      height: 42px;
      margin: 0 auto 14px;
      border-radius: 50%;
      border: 3px solid rgba(26, 188, 189, 0.18);
      border-top-color: #1abcbd;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .boot-title { font-size: 18px; font-weight: 700; letter-spacing: 0.02em; }
    .boot-sub { margin-top: 4px; font-size: 12px; color: #8a8f9c; }
  </style>
</head>
<body>
  <div class="boot-shell" id="boot-shell">
    <div class="boot-card">
      <div class="boot-ring"></div>
      <div class="boot-title">VAPLI</div>
      <div class="boot-sub">Loading audit workspace…</div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const shell = document.getElementById('boot-shell');
      if (shell) shell.remove();
    });
  </script>
</body>
</html>
