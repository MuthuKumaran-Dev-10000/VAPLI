name: lubrication_indicator
description: Lubrication Level Monitor - Industrial IoT Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

  # Firebase
  # firebase_core: ^2.27.1
  # firebase_database: ^10.4.9
  
  firebase_core: ^4.9.0
  firebase_database: ^12.4.1
  # firebase_core: ^4.8.0  #old version
  # firebase_database: ^12.4.0
  # QR Code
  # mobile_scanner: ^3.5.6 #old version
  
  mobile_scanner: ^7.2.0

  qr_flutter: ^4.1.0

  # Charts
  # fl_chart: ^0.66.2

  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  # screenshot: ^2.1.0
  share_plus: ^7.2.2
  collection: ^1.18.0
  screenshot: ^3.0.0
  image_picker: ^1.2.2
  excel: ^4.0.6
  http: ^1.2.1
  mime: ^1.0.5
  http_parser: ^4.0.2
  fl_chart: ^1.2.0
  cached_network_image: ^3.4.1
 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # - assets/images/
    - assets/icon.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.jpg"